# Prefix
set -g prefix C-s
unbind C-b
bind -N "Send prefix" C-s send-prefix

# See https://github.com/tmux-plugins/tmux-sensible for sensible defaults
# Reload configuration with `prefix R` (from tmux-sensible)

# Color and mouse
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on

# Clipboard
set -g set-clipboard on
set -g allow-passthrough on
set -as terminal-features ",*:clipboard"

# Resizes a window based on other attached clients/sessions that are viewing it.
setw -g aggressive-resize on

# Enables reporting modified key combinations that traditional terminal
# sequences cannot represent.
set -g extended-keys on
set -g extended-keys-format csi-u


# Move between panes as in Vim
setw -g mode-keys vi
bind-key -N "Focus pane left"  h select-pane -L
bind-key -N "Focus pane down"  j select-pane -D
bind-key -N "Focus pane up"    k select-pane -U
bind-key -N "Focus pane right" l select-pane -R

# Resize panes
bind-key -N "Resize pane up"    C-k resize-pane -U 5
bind-key -N "Resize pane down"  C-j resize-pane -D 5
bind-key -N "Resize pane left"  C-h resize-pane -L 5
bind-key -N "Resize pane right" C-l resize-pane -R 5

# Other
bind-key -N "Switch to last window" a last-window

# Bring a pane to current window
bind-key -N "Bring a pane to current window" @ choose-window 'join-pane -h -s "%%"'

# Open new panes in current directory
bind -N "Split pane vertically"   '"' split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" %   split-window -h -c "#{pane_current_path}"

# Open new windows in current directory
bind -N "New window in current directory" c new-window -c "#{pane_current_path}"


# LIST OF PLUGINS
# Install new plugins with `prefix I`, upgrade them with `prefix U`.
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tpm'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'


# Status and window list
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Custom theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
#
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#
run '~/.tmux/plugins/tpm/tpm'
